<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class poster gallery</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
    <script src="supabase-config.js"></script>
    <script src="poster-core.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 0%, #1b2836, #0b1118 70%);
            color: #e8eef3;
            font: 16px/1.4 system-ui, sans-serif;
            overflow-x: hidden;
        }
        main { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; }

        header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 28px 0; }
        h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
        h1 span { color: #77c1d2; }
        .count { color: #8ea2b2; margin-top: 4px; }
        .demo { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: #3a2a10; color: #f5c26b; font-size: 13px; }
        .qr { display: flex; gap: 12px; align-items: center; background: #fff; color: #0f1720; border-radius: 14px; padding: 10px 14px 10px 10px; }
        .qr svg { width: 92px; height: 92px; display: block; }
        .qr strong { display: block; font-size: 15px; }
        .qr span { font-size: 12px; color: #4a5b6a; }

        /* the carousel */
        .stage { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 10px 16px; min-height: 0; }
        .slide { display: grid; justify-items: center; gap: 12px; }
        .slide svg { height: min(60dvh, 820px); width: auto; max-width: 100%; border-radius: 4px; box-shadow: 0 30px 80px #000a; }
        .caption { text-align: center; }
        .caption strong { font-size: 22px; }
        .caption span { color: #8ea2b2; }
        .nav { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #2a3b4c; background: #17222e; color: #e8eef3; font-size: 22px; cursor: pointer; justify-self: center; }
        .nav:hover { border-color: #77c1d2; }
        .empty { text-align: center; color: #8ea2b2; }

        /* thumbnails + controls */
        footer { padding: 0 28px 20px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 14px; color: #8ea2b2; font-size: 14px; margin-bottom: 12px; }
        .controls button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid #2a3b4c; background: #17222e; color: #e8eef3; cursor: pointer; }
        .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-behavior: smooth; }
        .thumbs button { flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; opacity: .55; transition: opacity .2s, border-color .2s; }
        .thumbs button.on { border-color: #77c1d2; opacity: 1; }
        .thumbs svg { display: block; width: 48px; height: 64px; border-radius: 4px; }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            border-radius: 999px;
            background: #f472b6;
            color: #0f1720;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 10px 30px #0008;
            z-index: 10;
        }

        @media (max-width: 800px) {
            header { padding: 16px 16px 0; }
            .qr { display: none; }
            .stage { grid-template-columns: 1fr; padding: 10px 12px; }
            .nav { display: none; }
            .slide svg { height: auto; width: 100%; max-height: 66dvh; }
            footer { padding: 0 12px 16px; }
        }
    </style>
</head>
<body>
    <main
        x-data="gallery"
        x-cloak
        @keydown.window="key($event)"
        @touchstart.passive="touchX = $event.touches[0].clientX"
        @touchend="swipe($event.changedTouches[0].clientX)"
    >
        <header>
            <div>
                <h1><span>class</span> poster gallery</h1>
                <div class="count" x-text="posters.length + (posters.length === 1 ? ' poster' : ' posters')"></div>
                <div class="demo" x-show="!online">demo mode · connect Supabase in supabase-config.js</div>
            </div>
            <a class="qr" :href="makerUrl" target="_blank">
                <div x-html="qrSvg"></div>
                <div><strong>make yours</strong><span>scan, design,<br>press submit</span></div>
            </a>
        </header>

        <section class="stage">
            <button class="nav" @click="prev()" aria-label="previous poster">‹</button>

            <template x-if="current">
                <div class="slide">
                    <!-- every slide change plays a small fade-in -->
                    <svg
                        viewBox="0 0 600 800"
                        x-html="markup(current.poster)"
                        x-effect="index; $el.animate([{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'ease-out' })"
                        role="img"
                        :aria-label="current.poster.title + ' by ' + current.name"
                    ></svg>
                    <div class="caption">
                        <strong x-text="current.name"></strong>
                        <span x-text="' · ' + (index + 1) + ' / ' + posters.length"></span>
                    </div>
                </div>
            </template>
            <p class="empty" x-show="!current">No posters yet. Be the first!</p>

            <button class="nav" @click="next()" aria-label="next poster">›</button>
        </section>

        <footer>
            <div class="controls">
                <button @click="playing = !playing" x-text="playing ? '❚❚ pause' : '▶ play'"></button>
                <span>← → to browse · space to pause</span>
            </div>
            <div class="thumbs" x-ref="thumbs">
                <template x-for="(item, i) in posters" :key="item.id">
                    <button :class="{ on: i === index }" @click="go(i)" :aria-label="'poster by ' + item.name">
                        <svg viewBox="0 0 600 800" x-html="markup(item.poster)"></svg>
                    </button>
                </template>
            </div>
        </footer>

        <div class="toast" x-show="toast" x-transition x-text="toast"></div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('gallery', () => ({
                posters: [],
                index: 0,
                playing: true,
                online: !!galleryDb(),
                toast: '',
                touchX: null,
                makerUrl: new URL('index.html', location.href).href,
                timer: null,
                refresher: null,

                get current() {
                    return this.posters[this.index] || null;
                },

                // a qr code that points to the poster maker
                get qrSvg() {
                    const qr = qrcode(0, 'M');
                    qr.addData(this.makerUrl);
                    qr.make();
                    return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
                },

                async init() {
                    if (!this.online) {
                        // demo mode: the presets as example posters
                        this.posters = Object.entries(PRESETS).map(([title, poster], i) => ({ id: 'demo-' + i, name: 'example · ' + title, poster: sanitizePoster(poster) }));
                    } else {
                        await this.refresh();
                        watchPosters(poster => this.arrived(poster));
                        // every 30s: pick up posters you hid in the dashboard, and anything live updates missed
                        this.refresher = setInterval(() => this.refresh(), 30000);
                    }
                    this.timer = setInterval(() => this.playing && this.next(), 6000);
                },

                destroy() {
                    clearInterval(this.timer);
                    clearInterval(this.refresher);
                },

                async refresh() {
                    try {
                        const currentId = this.current?.id;
                        this.posters = await loadPosters();
                        const i = this.posters.findIndex(p => p.id === currentId);
                        this.index = i >= 0 ? i : Math.max(0, this.posters.length - 1);
                    } catch (e) {
                        this.flash('⚠️ could not load the gallery');
                        console.error(e);
                    }
                },

                // a new poster: add it, jump to it, and make some noise about it
                arrived(poster) {
                    if (this.posters.some(p => p.id === poster.id)) return;
                    this.posters.push(poster);
                    this.go(this.posters.length - 1);
                    this.flash('🎉 new poster by ' + poster.name);
                },

                markup(poster) {
                    return posterMarkup(poster);
                },

                go(i) {
                    if (!this.posters.length) return;
                    this.index = (i + this.posters.length) % this.posters.length;
                    // keep the active thumbnail in the middle of the strip (only the strip scrolls, not the page)
                    this.$nextTick(() => {
                        const strip = this.$refs.thumbs;
                        const thumb = strip.querySelectorAll('button')[this.index];
                        if (thumb) strip.scrollTo({ left: thumb.offsetLeft - strip.clientWidth / 2 + thumb.clientWidth / 2 });
                    });
                },

                next() { this.go(this.index + 1); },
                prev() { this.go(this.index - 1); },

                key(e) {
                    if (e.key === 'ArrowRight') this.next();
                    if (e.key === 'ArrowLeft') this.prev();
                    if (e.key === ' ') {
                        e.preventDefault();
                        this.playing = !this.playing;
                    }
                },

                swipe(x) {
                    if (this.touchX === null) return;
                    const dx = x - this.touchX;
                    if (Math.abs(dx) > 50) dx < 0 ? this.next() : this.prev();
                    this.touchX = null;
                },

                flash(text) {
                    this.toast = text;
                    setTimeout(() => this.toast = '', 3500);
                },
            }));
        });
    </script>
</body>
</html>
